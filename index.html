<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHITE ROOM V10 // SUBJECT 01</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F5F0;--ink:#0A0A0A;--paper:#FFFFFF;--line:#0A0A0A;--neon:#D6FF57;--cyan:#00E5CC}
*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono',monospace}
body{background:var(--bg);color:var(--ink);overflow-x:hidden}
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px}
.wrap{max-width:520px;margin:0 auto;padding:18px}
.hero{border:3px solid var(--ink);background:var(--paper);padding:18px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:0;right:0;width:80px;height:80px;background:repeating-linear-gradient(45deg, #000 0 2px, transparent 2px 6px);opacity:0.08}
.title{font-family:'Space Grotesk',sans-serif;font-size:52px;line-height:0.85;font-weight:700;text-transform:uppercase;letter-spacing:-3px}
.title.outline{-webkit-text-stroke:2px var(--ink);color:transparent}
.meta{margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.meta-box{border:2px solid var(--ink);padding:10px;background:#fff}
.meta-box.dark{background:var(--ink);color:#fff}
.meta-lbl{font-size:9px;opacity:0.6;letter-spacing:1px}
.meta-val{font-size:18px;font-weight:700;margin-top:2px}
.bar{height:14px;border:2px solid var(--ink);background:#E9E9E3;margin-top:10px;position:relative}
.bar-fill{height:100%;background:var(--ink);width:0%;transition:width 0.6s cubic-bezier(0.16,1,0.3,1)}
.bar-fill.neon{background:var(--neon)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:3px solid var(--ink);padding:12px;font-weight:700;font-size:12px;text-align:center;cursor:pointer;text-transform:uppercase;transition:0.15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0px var(--ink)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn-black{background:var(--ink);color:#fff}
.section-label{margin-top:30px;margin-bottom:12px;font-family:'Space Grotesk';font-size:14px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:8px}
.section-label::before{content:'';width:10px;height:10px;background:var(--ink);display:inline-block}
</style>
</head>
<body>
<div class="top"><span>CLASSIFIED // WR-01</span><span id="liveTime">00:00:00</span><span id="rankTop">E-RANK</span></div>
<div class="wrap">
<div class="hero">
<div class="title">WHITE<br><span class="outline">ROOM</span><br><span id="modeTitle" style="font-size:18px;letter-spacing:4px;background:var(--neon);padding:2px 8px;-webkit-text-stroke:0;color:#000">- SCHOOL PROTOCOL</span></div>
<div class="meta">
<div class="meta-box dark"><div class="meta-lbl">RANK</div><div class="meta-val" id="rank">E-RANK</div><div style="font-size:9px;margin-top:4px">LVL <span id="level">1</span></div></div>
<div class="meta-box"><div class="meta-lbl">COMPLETION</div><div class="meta-val" id="count">0/10</div><div style="font-size:9px">DONE TODAY</div></div>
<div class="meta-box"><div class="meta-lbl">TOTAL XP</div><div class="meta-val" id="xp">0</div><div style="font-size:9px">NEXT: <span id="nextXp">100</span></div></div>
</div>
<div class="bar"><div class="bar-fill" id="progress"></div></div>
<div class="bar" style="height:8px;margin-top:6px"><div class="bar-fill neon" id="xpProgress"></div></div>
<div class="btns"><div class="btn btn-black" id="modeBtn">⟡ SWITCH MODE</div><div class="btn" id="chuttiBtn">☾ HOLIDAY</div></div>
</div>
<div class="section-label">DAY PROTOCOL</div>
<div id="task-list"></div>
<div class="section-label" style="margin-top:28px">EXTRA PROTOCOLS <span style="background:var(--neon);border:1.5px solid #000;padding:2px 6px;font-size:10px">+20 XP EACH</span></div>
<div id="extra-list"></div>

<div style="margin-top:30px;border:3px solid var(--ink);background:#fff;padding:14px">
<div style="display:flex;justify-content:space-between"><span style="font-weight:700;font-size:12px;letter-spacing:2px">PRIVATE LOG // AUTO-SAVE</span><span style="font-size:10px;opacity:0.5">WR-LOG</span></div>
<textarea id="log1" placeholder="What did you conquer today?" style="width:100%;border:2px solid #000;padding:12px;margin-top:12px;outline:none;font-size:12px;min-height:70px;resize:none;background:#F9F9F6"></textarea>
<div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:10px;margin-top:10px">
<div class="btn btn-black" id="lockBtn" style="font-size:11px">LOCK DAY → NEXT DAY</div>
<div class="btn" id="cheatBtn" style="border-color:#FF3B30;color:#FF3B30">-200 XP CHEAT</div>
</div>
<div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div class="btn" id="restartBtn" style="font-size:10px;padding:10px">RESTART TODAY</div>
<div class="btn" id="resetAllBtn" style="font-size:10px;padding:10px;background:#FFEAEA">RESET ALL</div>
</div>
</div>
</div>
<script>
const SCHOOL_DATA=[
{t:"05:20 AM",title:"UTHNA",q:"Winners don't wait for sunrise."},
{t:"05:20-06:30",title:"MORNING REVISION",q:"While they dream, you sharpen."},
{t:"06:30-01:10",title:"SCHOOL",q:"Don't attend. Dominate."},
{t:"01:10-02:00",title:"POWER NAP + LUNCH",q:"Rest is strategy, not escape."},
{t:"02:00-04:50",title:"DEEP STUDY",q:"Distraction is a choice you make."},
{t:"04:50-06:15",title:"WORKOUT",q:"Pain is just data entering the body."},
{t:"06:15-07:30",title:"CODING & CHESS",q:"The world is a chessboard."},
{t:"07:30-08:00",title:"FRESH RESET",q:"Wash emotions away."},
{t:"08:00-10:00",title:"HOMEWORK & DINNER",q:"Leave nothing for tomorrow.",red:true},
{t:"10:00 PM",title:"SLEEP",q:"Preparation for next war."}
];
const HOLIDAY_DATA=[
{t:"05:20 AM",title:"WAKE UP",q:"Discipline starts when others sleep."},
{t:"05:20-07:00",title:"REVISION",q:"First revision is real power."},
{t:"07:00-08:30",title:"STUDY",q:"Attack your weakest subject."},
{t:"08:30-09:00",title:"BREAKFAST",q:"Fuel like a warrior."},
{t:"09:00-11:00",title:"STUDY",q:"Silence + Focus = Fear for others."},
{t:"11:00-01:00",title:"CODING AND CHESS",q:"Control the board, control the world."},
{t:"01:00-02:00",title:"REST AND LUNCH",q:"Rest is strategy."},
{t:"02:00-04:15",title:"STUDY",q:"Revision is domination."},
{t:"04:15-06:30",title:"WORKOUT",q:"Strong mind needs strong body."},
{t:"06:30-07:30",title:"REST AND FRESH",q:"Reset. Rebuild. Return."},
{t:"07:30-09:30",title:"HOMEWORK AND DINNER",q:"End day with zero debt.",red:true},
{t:"09:30 PM",title:"SLEEP",q:"Sleep is weapon reloading."}
];
const EXTRA_DATA=[
{title:"NO PHONE / NO SOCIAL",q:"Dopamine detox"},
{title:"NO SUGAR",q:"No poison"},
{title:"NO JUNK FOOD",q:"Clean fuel"},
{title:"2L WATER",q:"Hydration protocol"},
{title:"NO FAP",q:"Absolute control"},
{title:"MEDITATION 10M",q:"Mind sharpening"},
{title:"READ 20 PAGES",q:"Knowledge stack"},
{title:"COLD SHOWER",q:"Pain = Power"},
{title:"SLEEP BEFORE 11PM",q:"Discipline check"}
];
let mode=localStorage.getItem('v7_mode')||'SCHOOL';
if(!localStorage.getItem('v7_mode') && new Date().getDay()===0) mode='HOLIDAY';

function render(){
let DATA=mode==='SCHOOL'?SCHOOL_DATA:HOLIDAY_DATA;
document.getElementById('modeTitle').innerText=`- ${mode} PROTOCOL`;
let list=document.getElementById('task-list');list.innerHTML='';
let saved=JSON.parse(localStorage.getItem('tasks_'+mode)||'[]');
DATA.forEach((d,i)=>{
let ok=saved[i];
let el=document.createElement('div');
el.style.cssText=`border:3px solid ${d.red&&!ok?'#FF3B30':'#000'};background:${ok?'#0A0A0A':'#fff'};color:${ok?'#fff':'#000'};padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:0.2s;${d.red&&!ok?'box-shadow:6px 6px 0 #FF3B30':''}`;
el.innerHTML=`<div style="font-size:11px;min-width:75px;opacity:0.6;border-right:${ok?'1px solid #333':'1px solid #ddd'};padding-right:10px">${d.t}</div><div style="flex:1"><div style="font-family:Space Grotesk;font-weight:700;font-size:14px;letter-spacing:0.5px">${d.title} ${ok?'✓':''}</div><div style="font-size:10px;opacity:0.6;margin-top:2px">"${d.q}"</div></div><div style="width:34px;height:34px;border:3px solid ${ok?'#D6FF57':'#000'};background:${ok?'#D6FF57':'#fff'};display:flex;align-items:center;justify-content:center;font-weight:900;color:#000">${ok?'✓':''}</div>`;
el.onclick=()=>{saved[i]=!saved[i];localStorage.setItem('tasks_'+mode,JSON.stringify(saved));render();};
list.appendChild(el);
});
let extraList=document.getElementById('extra-list');extraList.innerHTML='';
let extraSaved=JSON.parse(localStorage.getItem('extra_tasks')||'[]');
EXTRA_DATA.forEach((d,i)=>{
let ok=extraSaved[i];
let el=document.createElement('div');
el.style.cssText=`border:2px dashed #000;background:#fff;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;opacity:${ok?0.35:1}`;
el.innerHTML=`<div><div style="font-weight:700;font-size:11px">${d.title} <span style="background:#000;color:#fff;padding:1px 5px;font-size:9px">+20</span></div><div style="font-size:9px;opacity:0.6">${d.q}</div></div><div style="width:26px;height:26px;border:2px solid #000;background:${ok?'#000':'#fff'};color:#fff;display:flex;align-items:center;justify-content:center">${ok?'✓':''}</div>`;
el.onclick=()=>{extraSaved[i]=!extraSaved[i];localStorage.setItem('extra_tasks',JSON.stringify(extraSaved));render();};
extraList.appendChild(el);
});
let main=saved.filter(Boolean).length, extra=extraSaved.filter(Boolean).length;
let total=(parseInt(localStorage.getItem('totalXP')||'0'))+main*12+extra*20;
document.getElementById('count').innerText=`${main}/${DATA.length}`;
document.getElementById('xp').innerText=total;
document.getElementById('progress').style.width=(main/DATA.length*100)+'%';
let lvl=Math.floor(total/100)+1;document.getElementById('level').innerText=lvl;
document.getElementById('nextXp').innerText=(lvl*100-total)+' XP';
document.getElementById('xpProgress').style.width=(total%100)+'%';
let rank='E-RANK';if(lvl>=5)rank='D-RANK';if(lvl>=15)rank='C-RANK';if(lvl>=30)rank='B-RANK';if(lvl>=50)rank='A-RANK';if(lvl>=75)rank='S-RANK';
document.getElementById('rank').innerText=rank;document.getElementById('rankTop').innerText=rank;
}
document.getElementById('modeBtn').onclick=()=>{mode=mode==='SCHOOL'?'HOLIDAY':'SCHOOL';localStorage.setItem('v7_mode',mode);render();};
document.getElementById('chuttiBtn').onclick=()=>{mode='HOLIDAY';localStorage.setItem('v7_mode',mode);render();};
document.getElementById('lockBtn').onclick=()=>{
let m=JSON.parse(localStorage.getItem('tasks_'+mode)||'[]').filter(Boolean).length;
let e=JSON.parse(localStorage.getItem('extra_tasks')||'[]').filter(Boolean).length;
let today=m*12+e*20;let total=parseInt(localStorage.getItem('totalXP')||'0')+today;
localStorage.setItem('totalXP',total);localStorage.removeItem('tasks_'+mode);localStorage.removeItem('extra_tasks');
alert('PROTOCOL LOCKED +'+today+' XP | TOTAL '+total);render();
};
document.getElementById('cheatBtn').onclick=()=>{let t=parseInt(localStorage.getItem('totalXP')||'0');localStorage.setItem('totalXP',Math.max(0,t-200));render();};
document.getElementById('restartBtn').onclick=()=>{localStorage.removeItem('tasks_'+mode);localStorage.removeItem('extra_tasks');render();};
document.getElementById('resetAllBtn').onclick=()=>{if(confirm('WIPE ALL DATA?')){localStorage.clear();location.reload();}};
setInterval(()=>{document.getElementById('liveTime').innerText=new Date().toLocaleTimeString();},1000);
document.getElementById('log1').value=localStorage.getItem('log1')||'';document.getElementById('log1').oninput=e=>localStorage.setItem('log1',e.target.value);
render();
</script>
</body>
</html>
