<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Second Brain Vault</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#eee;font-family:Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.35;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:40px 40px}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#333;border-radius:20px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.card{transition:.2s}
.card:hover{transform:translateY(-2px);border-color:#444;box-shadow:0 12px 30px #0008}
.dragging{opacity:.35;transform:scale(.98)}
.column.dragover{border-color:#666;background:#ffffff04}
.high{border-left:3px solid #f87171}
.medium{border-left:3px solid #fbbf24}
.low{border-left:3px solid #60a5fa}
.modal{opacity:0;pointer-events:none;transition:.2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-box{transform:translateY(15px) scale(.98);transition:.2s}
.modal.show .modal-box{transform:none}
.toast{opacity:0;transform:translate(-50%,20px);transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes enter{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.enter{animation:enter .25s ease}
</style>
</head>
<body>

<div class="min-h-screen">
<header class="sticky top-0 z-40 bg-[#0a0a0acc] backdrop-blur-xl border-b border-white/5">
<div class="max-w-[1500px] mx-auto px-4 sm:px-6">
<div class="h-16 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center font-black text-xs">SB</div>
<div>
<h1 class="font-semibold tracking-tight">Second Brain Vault</h1>
<p class="text-[9px] uppercase tracking-[.25em] text-neutral-600">External Memory</p>
</div>
</div>
<div class="flex gap-2">
<button id="exportBtn" class="hidden sm:block px-3 py-2 rounded-lg border border-white/10 text-xs text-neutral-400 hover:text-white hover:bg-white/5">↓ Export</button>
<button id="clearBtn" class="hidden sm:block px-3 py-2 rounded-lg border border-white/10 text-xs text-neutral-400 hover:text-red-400">Clear</button>
<div class="w-9 h-9 rounded-xl border border-white/10 flex items-center justify-center text-xs text-neutral-500">●</div>
</div>
</div>
</div>
</header>

<main class="max-w-[1500px] mx-auto px-4 sm:px-6 py-6">

<section class="mb-5">
<div class="bg-[#111] border border-white/10 rounded-2xl p-3 sm:p-4">
<div class="flex gap-3 items-center">
<div class="hidden sm:flex w-10 h-10 rounded-xl bg-white/5 items-center justify-center text-neutral-400 text-xl">+</div>
<input id="quickAdd" class="flex-1 bg-transparent outline-none text-base sm:text-lg placeholder:text-neutral-600" placeholder="What do you need to build/make right now?" autocomplete="off">
<button id="addBtn" class="px-5 py-3 rounded-xl bg-white text-black text-sm font-semibold hover:bg-neutral-200 active:scale-95 transition">Add</button>
</div>
<div class="flex justify-between mt-2 px-1 text-[10px] text-neutral-600">
<span>Press Enter to capture instantly</span>
<span class="hidden sm:block">Stored locally on this device</span>
</div>
</div>
</section>

<section id="focus" class="mb-5"></section>

<section class="grid grid-cols-3 gap-3 mb-5">
<div class="bg-[#111] border border-white/10 rounded-2xl p-4">
<p class="text-[10px] uppercase tracking-widest text-neutral-600">Total Ideas</p>
<p id="total" class="text-2xl sm:text-3xl font-semibold mt-1">0</p>
</div>
<div class="bg-[#111] border border-white/10 rounded-2xl p-4">
<p class="text-[10px] uppercase tracking-widest text-neutral-600">To-Build</p>
<p id="todo" class="text-2xl sm:text-3xl font-semibold mt-1">0</p>
</div>
<div class="bg-[#111] border border-white/10 rounded-2xl p-4">
<p class="text-[10px] uppercase tracking-widest text-neutral-600">Built</p>
<p id="built" class="text-2xl sm:text-3xl font-semibold mt-1">0</p>
</div>
</section>

<section class="mb-5">
<div class="relative bg-[#111] border border-white/10 rounded-xl">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-600">⌕</span>
<input id="search" class="w-full bg-transparent outline-none py-3.5 pl-11 pr-4 text-sm placeholder:text-neutral-600" placeholder="Search your entire second brain..." autocomplete="off">
</div>
</section>

<section id="board" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4"></section>

</main>

<footer class="text-center py-8">
<p class="text-[10px] text-neutral-700 tracking-widest">SECOND BRAIN VAULT · THINK LESS. BUILD MORE.</p>
</footer>
</div>

<div id="modal" class="modal fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
<div class="modal-box w-full max-w-lg bg-[#111] border border-white/10 rounded-2xl shadow-2xl">
<div class="px-5 py-4 border-b border-white/5 flex justify-between items-center">
<div>
<h2 class="font-semibold">Edit Item</h2>
<p class="text-xs text-neutral-600 mt-1">Update your stored thought.</p>
</div>
<button id="closeModal" class="w-8 h-8 rounded-lg text-neutral-500 hover:bg-white/5 hover:text-white">×</button>
</div>

<form id="editForm" class="p-5 space-y-4">
<input type="hidden" id="editId">

<div>
<label class="block text-xs text-neutral-500 mb-2">Title</label>
<input id="editTitle" required maxlength="120" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 outline-none text-sm focus:border-white/30" placeholder="What are you building?">
</div>

<div>
<label class="block text-xs text-neutral-500 mb-2">Description</label>
<textarea id="editDesc" maxlength="500" rows="3" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 outline-none text-sm resize-none focus:border-white/30" placeholder="A little context..."></textarea>
</div>

<div>
<label class="block text-xs text-neutral-500 mb-2">Tags</label>
<input id="editTags" maxlength="200" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 outline-none text-sm focus:border-white/30" placeholder="#AI, #Python, #Website">
</div>

<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-xs text-neutral-500 mb-2">Priority</label>
<select id="editPriority" class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 outline-none text-sm">
<option value="low">Low</option>
<option value="medium" selected>Medium</option>
<option value="high">High</option>
</select>
</div>

<div>
<label class="block text-xs text-neutral-500 mb-2">Vault</label>
<select id="editVault" class="w-full bg-[#0a0a0a] border border-white/10 rounded-xl px-4 py-3 outline-none text-sm">
<option value="idea">Idea Vault</option>
<option value="todo">To-Build</option>
<option value="progress">In-Progress</option>
<option value="built">Built</option>
</select>
</div>
</div>

<div class="flex gap-3 pt-1">
<button type="button" id="cancelEdit" class="flex-1 py-3 rounded-xl border border-white/10 text-sm text-neutral-400 hover:bg-white/5">Cancel</button>
<button class="flex-1 py-3 rounded-xl bg-white text-black text-sm font-semibold hover:bg-neutral-200">Save Changes</button>
</div>
</form>
</div>
</div>

<div id="toast" class="toast fixed bottom-5 left-1/2 z-[60] bg-[#171717] border border-white/10 rounded-xl px-4 py-3 text-sm shadow-2xl"></div>

<!-- PART 2: JAVASCRIPT YAHAN SE PASTE KARNA HAI -->
<script>
const KEY="secondBrainVault_v2";

const VAULTS={
  idea:{name:"Idea Vault",sub:"Raw thoughts",icon:"✦"},
  todo:{name:"To-Build",sub:"Ready to execute",icon:"→"},
  progress:{name:"In-Progress",sub:"Currently building",icon:"◐"},
  built:{name:"Built",sub:"Completed",icon:"✓"}
};

let items=JSON.parse(localStorage.getItem(KEY)||"[]");
let searchText="";
let draggedId=null;
let focusId=null;

const $=id=>document.getElementById(id);

function save(){
  localStorage.setItem(KEY,JSON.stringify(items));
}

function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function esc(x){
  const d=document.createElement("div");
  d.textContent=x??"";
  return d.innerHTML;
}

function tags(value){
  return value.split(/[,\s]+/)
    .map(x=>x.trim())
    .filter(Boolean)
    .map(x=>x.startsWith("#")?x:"#"+x)
    .slice(0,12);
}

function toast(msg){
  const t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

function date(t){
  return new Date(t).toLocaleDateString(undefined,{
    month:"short",day:"numeric"
  });
}

function addIdea(){
  const input=$("quickAdd");
  const title=input.value.trim();
  if(!title)return;

  const now=Date.now();

  items.unshift({
    id:id(),
    title:title.slice(0,120),
    description:"",
    tags:[],
    priority:"medium",
    vault:"idea",
    createdAt:now,
    updatedAt:now
  });

  save();
  input.value="";
  render();
  toast("Idea captured ✓");
  input.focus();
}

function matches(item){
  if(!searchText)return true;

  const text=[
    item.title,
    item.description,
    ...(item.tags||[]),
    item.priority,
    VAULTS[item.vault]?.name||""
  ].join(" ").toLowerCase();

  return text.includes(searchText);
}

function card(item){
  const tagHTML=(item.tags||[]).map(t=>
    `<span class="px-2 py-1 rounded-md bg-white/5 text-[10px] text-neutral-500">${esc(t)}</span>`
  ).join("");

  return `
  <article draggable="true"
    data-id="${esc(item.id)}"
    class="card enter ${esc(item.priority)} bg-[#141414] border border-white/10 rounded-xl p-4 cursor-grab">

    <div class="flex justify-between gap-3">
      <h3 class="font-medium text-sm leading-5 break-words">
        ${esc(item.title)}
      </h3>

      <button data-action="menu" data-id="${esc(item.id)}"
        class="w-7 h-7 shrink-0 rounded-lg text-neutral-600 hover:text-white hover:bg-white/5">
        ⋮
      </button>
    </div>

    ${
      item.description
      ? `<p class="mt-2 text-xs leading-5 text-neutral-500 break-words">${esc(item.description)}</p>`
      : `<p class="mt-2 text-[11px] text-neutral-700 italic">No description yet.</p>`
    }

    ${
      tagHTML
      ? `<div class="flex flex-wrap gap-1.5 mt-3">${tagHTML}</div>`
      : ""
    }

    <div class="flex justify-between items-center mt-4 pt-3 border-t border-white/5">
      <div class="text-[10px] text-neutral-600">
        ${item.priority} · ${date(item.updatedAt)}
      </div>

      <div class="actions hidden gap-1">
        <button data-action="edit" data-id="${esc(item.id)}"
          class="px-2 py-1 rounded-md text-[10px] text-neutral-500 hover:text-white hover:bg-white/5">
          Edit
        </button>

        <button data-action="delete" data-id="${esc(item.id)}"
          class="px-2 py-1 rounded-md text-[10px] text-neutral-500 hover:text-red-400 hover:bg-red-400/5">
          Delete
        </button>
      </div>
    </div>
  </article>`;
}

function column(key){
  const v=VAULTS[key];

  const list=items.filter(x=>
    x.vault===key && matches(x)
  );

  return `
  <section data-vault="${key}"
    class="column bg-[#0f0f0f] border border-white/10 rounded-2xl min-h-[300px] flex flex-col transition">

    <div class="p-4 border-b border-white/5 flex justify-between items-center">
      <div class="flex gap-3 items-center">
        <div class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-sm text-neutral-400">
          ${v.icon}
        </div>
        <div>
          <h2 class="text-sm font-semibold">${v.name}</h2>
          <p class="text-[10px] text-neutral-600">${v.sub}</p>
        </div>
      </div>

      <span class="px-2 h-6 min-w-6 rounded-lg bg-white/5 flex items-center justify-center text-[10px] text-neutral-500">
        ${list.length}
      </span>
    </div>

    <div class="p-3 space-y-3 flex-1">
      ${
        list.length
        ? list.map(card).join("")
        : `<div class="border border-dashed border-white/10 rounded-xl p-6 text-center text-xs text-neutral-700">
             ${searchText?"No matching items.":"Nothing here yet."}
           </div>`
      }
    </div>
  </section>`;
}

function renderBoard(){
  $("board").innerHTML=
    Object.keys(VAULTS).map(column).join("");

  document.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",dragStart);
    c.addEventListener("dragend",dragEnd);

    c.addEventListener("mouseenter",()=>{
      const a=c.querySelector(".actions");
      if(a){a.classList.remove("hidden");a.classList.add("flex")}
    });

    c.addEventListener("mouseleave",()=>{
      const a=c.querySelector(".actions");
      if(a){a.classList.add("hidden");a.classList.remove("flex")}
    });

    c.addEventListener("dblclick",()=>{
      edit(c.dataset.id);
    });
  });

  document.querySelectorAll(".column").forEach(col=>{
    col.addEventListener("dragover",dragOver);
    col.addEventListener("dragleave",dragLeave);
    col.addEventListener("drop",drop);
  });
}

function dragStart(e){
  draggedId=e.currentTarget.dataset.id;
  e.currentTarget.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  e.dataTransfer.setData("text/plain",draggedId);
}

function dragEnd(e){
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".column")
    .forEach(x=>x.classList.remove("dragover"));
  draggedId=null;
}

function dragOver(e){
  e.preventDefault();
  const col=e.currentTarget;
  col.classList.add("dragover");
}

function dragLeave(e){
  const col=e.currentTarget;
  if(!col.contains(e.relatedTarget))
    col.classList.remove("dragover");
}

function drop(e){
  e.preventDefault();

  const col=e.currentTarget;
  col.classList.remove("dragover");

  const itemId=e.dataTransfer.getData("text/plain")||draggedId;
  const target=col.dataset.vault;

  const item=items.find(x=>x.id===itemId);

  if(!item||item.vault===target)return;

  item.vault=target;
  item.updatedAt=Date.now();

  save();
  render();
  toast(`Moved to ${VAULTS[target].name}`);
}

function renderFocus(){
  const candidates=items.filter(x=>x.vault==="todo");

  if(!candidates.length){
    focusId=null;
    $("focus").innerHTML=`
      <div class="bg-[#111] border border-dashed border-white/10 rounded-2xl p-5">
        <div class="flex gap-3 items-center">
          <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center text-neutral-600">◌</div>
          <div>
            <p class="text-[10px] uppercase tracking-[.25em] text-neutral-600">Daily Focus</p>
            <p class="text-sm text-neutral-500 mt-1">Move something into To-Build and your mission appears here.</p>
          </div>
        </div>
      </div>`;
    return;
  }

  let item=candidates.find(x=>x.id===focusId);

  if(!item){
    item=candidates[Math.floor(Math.random()*candidates.length)];
    focusId=item.id;
  }

  $("focus").innerHTML=`
    <div class="relative overflow-hidden bg-[#111] border border-white/10 rounded-2xl p-5 sm:p-6">
      <div class="absolute right-0 top-0 w-40 h-40 bg-white/[.025] rounded-full blur-3xl"></div>

      <div class="relative flex flex-col sm:flex-row justify-between gap-5 sm:items-center">
        <div>
          <div class="flex items-center gap-2 mb-3">
            <span class="w-2 h-2 bg-white rounded-full"></span>
            <span class="text-[10px] uppercase tracking-[.25em] text-neutral-500">Daily Focus</span>
          </div>

          <h2 class="text-xl sm:text-2xl font-semibold tracking-tight break-words">
            ${esc(item.title)}
          </h2>

          ${
            item.description
            ? `<p class="text-sm text-neutral-500 mt-2">${esc(item.description)}</p>`
            :""
          }
        </div>

        <button data-focus="${esc(item.id)}"
          class="shrink-0 px-5 py-3 rounded-xl bg-white text-black text-sm font-semibold hover:bg-neutral-200 active:scale-95 transition">
          Build this today →
        </button>
      </div>
    </div>`;
}

function stats(){
  $("total").textContent=items.length;
  $("todo").textContent=items.filter(x=>x.vault==="todo").length;
  $("built").textContent=items.filter(x=>x.vault==="built").length;
}

function render(){
  renderFocus();
  stats();
  renderBoard();
}

function edit(id){
  const item=items.find(x=>x.id===id);
  if(!item)return;

  $("editId").value=item.id;
  $("editTitle").value=item.title;
  $("editDesc").value=item.description||"";
  $("editTags").value=(item.tags||[]).join(" ");
  $("editPriority").value=item.priority||"medium";
  $("editVault").value=item.vault||"idea";

  $("modal").classList.add("show");

  setTimeout(()=>$("editTitle").focus(),100);
}

function closeModal(){
  $("modal").classList.remove("show");
  $("editForm").reset();
}

function saveEdit(e){
  e.preventDefault();

  const item=items.find(x=>x.id===$("editId").value);
  if(!item)return;

  item.title=$("editTitle").value.trim().slice(0,120);
  item.description=$("editDesc").value.trim().slice(0,500);
  item.tags=tags($("editTags").value);
  item.priority=$("editPriority").value;
  item.vault=$("editVault").value;
  item.updatedAt=Date.now();

  save();
  closeModal();
  render();
  toast("Changes saved ✓");
}

function deleteItem(id){
  const item=document.querySelector(`[data-id="${CSS.escape(id)}"]`);

  if(item){
    item.style.opacity="0";
    item.style.transform="scale(.94)";
  }

  setTimeout(()=>{
    items=items.filter(x=>x.id!==id);

    if(focusId===id)focusId=null;

    save();
    render();
    toast("Item deleted");
  },180);
}

$("addBtn").addEventListener("click",addIdea);

$("quickAdd").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    addIdea();
  }
});

$("search").addEventListener("input",e=>{
  searchText=e.target.value.trim().toLowerCase();
  renderBoard();
});

$("board").addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn)return;

  const id=btn.dataset.id;

  if(btn.dataset.action==="edit")edit(id);
  if(btn.dataset.action==="delete")deleteItem(id);

  if(btn.dataset.action==="menu"){
    const a=btn.closest(".card").querySelector(".actions");
    a.classList.toggle("hidden");
    a.classList.toggle("flex");
  }
});

$("focus").addEventListener("click",e=>{
  const btn=e.target.closest("[data-focus]");
  if(btn)edit(btn.dataset.focus);
});

$("editForm").addEventListener("submit",saveEdit);
$("closeModal").addEventListener("click",closeModal);
$("cancelEdit").addEventListener("click",closeModal);

$("modal").addEventListener("click",e=>{
  if(e.target===$("modal"))closeModal();
});

$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob(
    [JSON.stringify(items,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="second-brain-vault.json";
  a.click();

  URL.revokeObjectURL(url);
  toast("Vault exported ✓");
});

$("clearBtn").addEventListener("click",()=>{
  if(!items.length){
    toast("Vault is already empty");
    return;
  }

  if(confirm("Delete all items from your Second Brain Vault?")){
    items=[];
    focusId=null;
    save();
    render();
    toast("Vault cleared");
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("modal").classList.contains("show"))
    closeModal();

  if(e.key==="/"&&
     !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
    e.preventDefault();
    $("search").focus();
  }

  if(e.key.toLowerCase()==="n"&&
     !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){
    e.preventDefault();
    $("quickAdd").focus();
  }
});

render();

setTimeout(()=>$("quickAdd").focus(),300);
</script>

</body>
</html>
